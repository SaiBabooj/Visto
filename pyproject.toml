[project]
name = "voicebridge"
version = "0.1.0"
description = "Voice-first translation app between travellers and local drivers in Chennai"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/contracts",
    "services/gateway",
    "modules/providers",
    "modules/stt_gnani",
    "modules/tts_prep",
    "modules/tts_gnani",
    "modules/language",
    "modules/translation",
    "modules/verify",
]

[tool.uv.sources]
contracts = { workspace = true }
providers = { workspace = true }
stt-gnani = { workspace = true }
tts-prep = { workspace = true }
tts-gnani = { workspace = true }
language = { workspace = true }
translation = { workspace = true }
verify = { workspace = true }
gateway = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["packages", "services", "modules"]
pythonpath = [
    "packages/contracts/src",
    "services/gateway/src",
    "modules/providers/src",
    "modules/stt_gnani/src",
    "modules/tts_prep/src",
    "modules/tts_gnani/src",
    "modules/language/src",
    "modules/translation/src",
    "modules/verify/src"
]
markers = [
    "live: marks tests that require external live API credentials",
]
