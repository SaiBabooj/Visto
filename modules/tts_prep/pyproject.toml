[project]
name = "tts-prep"
version = "0.1.0"
description = "Text-to-Speech preparation and normalisation pipeline for Voicebridge"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
