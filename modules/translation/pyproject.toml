[project]
name = "translation"
version = "0.1.0"
description = "Translation module for Voicebridge"
requires-python = ">=3.11"
dependencies = [
    "contracts",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
