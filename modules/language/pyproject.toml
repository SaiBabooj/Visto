[project]
name = "language"
version = "0.1.0"
description = "Language normalisation, script detection, and rule-based entity tagging for Voicebridge"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "pyyaml>=6.0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
