[project]
name = "stt-gnani"
version = "0.1.0"
description = "Gnani Prisma Speech-to-Text adapter for Voicebridge"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "providers",
    "websockets>=12.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
