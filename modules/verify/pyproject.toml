[project]
name = "verify"
version = "0.1.0"
description = "Verification layer with back-translation, risk classification, and confirmation state machine"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "providers",
    "language",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
