[project]
name = "gateway"
version = "0.1.0"
description = "FastAPI Gateway for Voicebridge"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
